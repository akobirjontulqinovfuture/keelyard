[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "keelyard"
version = "1.0.0"
description = "Proof-of-work gate, rewind, helper swarm, usage saver and shared memory for Claude Code, Codex and OpenCode."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Akobir Tulqinov" }]
keywords = ["ai-agents", "claude-code", "codex", "opencode", "mcp", "developer-tools"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
# Upper bounds: the next major version is untested. CI runs the versions pip resolves inside these ranges.
dependencies = ["mcp>=1.2,<3", "httpx>=0.27,<1", "rich>=13.7,<16", "textual>=0.80,<9"]

[project.optional-dependencies]
web = ["playwright>=1.45,<2"]
report = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[project.scripts]
keelyard = "keelyard.cli:main"

[project.urls]
Homepage = "https://github.com/akobirjontulqinovfuture/keelyard"

[tool.hatch.build.targets.wheel]
packages = ["src/keelyard"]

[tool.ruff]
line-length = 145
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/keelyard/arena.py" = ["E501"]
"src/keelyard/cli.py" = ["E501"]
"src/keelyard/mcp_server.py" = ["E501"]
"src/keelyard/theme.py" = ["E501"]
"src/keelyard/report.py" = ["E501"]
