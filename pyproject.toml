[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "keelyard"
version = "1.2.1"
description = "Make AI coding agents (Claude Code, Codex, OpenCode) prove their work before they say done, undo any step, and use fewer tokens."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Akobir Tulqinov" }]
maintainers = [{ name = "Akobir Tulqinov" }]
keywords = ["ai-agents", "claude-code", "codex", "opencode", "mcp", "developer-tools", "llm", "coding-agent", "tests", "rollback", "snapshots", "token-optimization", "agentic-coding", "model-context-protocol", "claude", "openai-codex", "proof-gate"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
]
# Upper bounds: the next major version is untested. CI runs the versions pip resolves inside these ranges.
dependencies = ["mcp>=1.2,<3", "httpx>=0.27,<1", "rich>=13.7,<16", "textual>=0.80,<9"]

[project.optional-dependencies]
web = ["playwright>=1.45,<2"]
report = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
keelyard = "keelyard.cli:main"

[project.urls]
Homepage = "https://github.com/akobirjontulqinovfuture/keelyard"
Documentation = "https://akobirjontulqinovfuture.github.io/keelyard/"
Source = "https://github.com/akobirjontulqinovfuture/keelyard"
Issues = "https://github.com/akobirjontulqinovfuture/keelyard/issues"
Changelog = "https://github.com/akobirjontulqinovfuture/keelyard/blob/main/CHANGELOG.md"
"Claude Code guide" = "https://akobirjontulqinovfuture.github.io/keelyard/claude-code/"
"Codex guide" = "https://akobirjontulqinovfuture.github.io/keelyard/codex/"
FAQ = "https://akobirjontulqinovfuture.github.io/keelyard/faq/"
Security = "https://github.com/akobirjontulqinovfuture/keelyard/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/keelyard"]

[tool.mypy]
python_version = "3.11"
files = ["src/keelyard"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true

[tool.ruff]
line-length = 145
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/keelyard/arena.py" = ["E501"]
"src/keelyard/cli.py" = ["E501"]
"src/keelyard/mcp_server.py" = ["E501"]
"src/keelyard/theme.py" = ["E501"]
"src/keelyard/report.py" = ["E501"]
