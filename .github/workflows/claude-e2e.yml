name: claude-e2e
# keelyard inside the real Claude Code CLI, driven by a local scripted model: no Anthropic key, $0.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 5 * * 1"   # weekly, to catch Claude Code releases that change the hook contract
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm i -g @anthropic-ai/claude-code
      - run: pip install -e . pytest
      - run: claude --version
      - run: python scripts/claude_e2e.py -v
