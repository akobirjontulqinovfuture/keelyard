name: claude-e2e
# keelyard inside the real Claude Code CLI, driven by a local scripted model: no Anthropic key, $0.
on:
  push:
  pull_request:
  schedule:
    - cron: "37 5 * * 1"   # weekly, to catch Claude Code releases that change the hook contract
  workflow_dispatch:
permissions:
  contents: read
jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i -g @anthropic-ai/claude-code
      - run: pip install -e . pytest
      - run: claude --version
      - run: python scripts/claude_e2e.py -v
