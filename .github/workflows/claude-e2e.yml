name: claude-e2e
# keelyard inside the real Claude Code CLI, driven by a local scripted model: no Anthropic key, $0.
on:
  push:
  pull_request:
  schedule:
    - cron: "37 5 * * 1"   # weekly, to catch Claude Code releases that change the hook contract
  workflow_dispatch:
permissions:
  contents: read
jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm i -g @anthropic-ai/claude-code
      - run: pip install -e . pytest
      - run: claude --version
      - run: python scripts/claude_e2e.py -v
