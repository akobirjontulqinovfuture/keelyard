# Publishes to PyPI when a GitHub release is published, via Trusted Publishing (OIDC, no token stored).
# One-time setup on pypi.org: pending publisher = owner akobirjontulqinovfuture, repo keelyard,
# workflow "publish.yml", environment "pypi".
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install build twine && python -m build && twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: {subject-path: "dist/*"}
      - uses: pypa/gh-action-pypi-publish@release/v1
