name: codex-e2e
# keelyard inside the real Codex CLI, driven by a local scripted model: no OpenAI key, $0.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly, to catch Codex releases that change the hook contract
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i -g @openai/codex
      - run: pip install -e . pytest
      - run: codex --version
      - run: python scripts/codex_e2e.py -v
