name: codex-e2e
# keelyard inside the real Codex CLI, driven by a local scripted model: no OpenAI key, $0.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly, to catch Codex releases that change the hook contract
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm i -g @openai/codex
      - run: pip install -e . pytest
      - run: codex --version
      - run: python scripts/codex_e2e.py -v
