site_name: keelyard
site_description: keelyard makes Claude Code, Codex and OpenCode prove their work with passing tests, undo any step, and use fewer tokens.
site_url: https://akobirjontulqinovfuture.github.io/keelyard/
repo_url: https://github.com/akobirjontulqinovfuture/keelyard
repo_name: keelyard
edit_uri: edit/main/docs/
copyright: Apache-2.0 · Geist fonts under OFL-1.1
exclude_docs: |
  demo/
theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
  features: [navigation.sections, navigation.top, content.code.copy, search.highlight, navigation.footer]
  icon:
    repo: fontawesome/brands/github
extra_css: [assets/extra.css]
hooks: [hooks/seo.py]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Codex in 2 minutes: codex.md
  - Claude Code in 2 minutes: claude-code.md
  - Guarantees and limits: guarantees.md
  - Guide:
      - Proof gate: guide/proof.md
      - Rewind: guide/rewind.md
      - Smaller context: guide/context.md
      - Memory and usage: guide/memory.md
      - Always on: guide/brain.md
      - Presets: guide/presets.md
      - Swarm: guide/swarm.md
      - Arena: guide/arena.md
      - For agents: guide/agents.md
  - Reference:
      - CLI: cli.md
      - MCP tools: mcp.md
      - Configuration: config.md
      - Exit codes and JSON: json.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Alternatives: alternatives.md
  - Benchmarks: BENCHMARKS.md
  - Landscape: landscape.md
  - Feature matrix: feature-matrix.md
